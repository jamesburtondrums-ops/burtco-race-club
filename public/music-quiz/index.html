function getDB(){return new Promise((resolve,reject)=>{if(!('indexedDB' in window)){reject(new Error('Browser does not support IndexedDB'));return}const req=indexedDB.open('burtco-quiz-audio',2);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains('tracks'))req.result.createObjectStore('tracks',{keyPath:'id'});if(!req.result.objectStoreNames.contains('library'))req.result.createObjectStore('library',{keyPath:'id'})};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
async function saveAudio(it,file){const track=await saveLibraryFile(file);assignTrack(it,track);if(cloudSession){try{const path=await uploadCloud(track,file);it.audioCloudPath=path;save()}catch(e){libraryMessage='Cloud upload failed; local copy saved: '+e.message;}}await refreshLibrary();return track}

function normalize(s){return String(s||'').toLowerCase().replace(/\.(mp3|wav|m4a|ogg|aac|flac)$/i,'').replace(/[^a-z0-9]+/g,'')}
$('#bulkUploader').addEventListener('change',async e=>{const files=[...e.target.files];if(!files.length)return;const r=currentRound();let updated=0,skipped=0,failed=0;for(const file of files){const filename=file.name.replace(/\.[^.]+$/,'');const parts=filename.split(/\s+-\s+/);let matched=r.items.find(it=>(normalize(it.artist+' '+it.title)===normalize(filename))||(normalize(it.title+' '+it.artist)===normalize(filename))||(normalize(it.title)&&normalize(filename).includes(normalize(it.title))));if(!matched){skipped++;try{const rec=await saveLibraryFile(file);if(cloudSession)await uploadCloud(rec,file)}catch(err){failed++}continue}else updated++;try{await saveAudio(matched,file)}catch(err){failed++}}save();render();toast(`${updated-failed} tracks loaded · ${updated} matched · ${skipped} unmatched (saved to library)${failed?' · '+failed+' failed':''}`);e.target.value=''});

// Reusable music library: each song has one stable ID independent of the quiz/question.
const validAudio=f=>f && (f.type.startsWith('audio/') || /\.(mp3|wav|m4a|ogg|aac|flac)$/i.test(f.name));
const sizeText=n=>!n?'0 B':n<1024*1024?(n/1024).toFixed(0)+' KB':(n/1024/1024).toFixed(1)+' MB';
function libraryLabel(t){return t.name||t.audioName||'Unnamed recording'}
function inferFileMeta(name){const raw=(name||'').replace(/\.[^.]+$/,'');const parts=raw.split(/\s+-\s+/);return {artist:parts.length>1?parts[0]:'',title:parts.length>1?parts.slice(1).join(' - '):raw}}
async function getLocalAudio(id){const db=await getDB();try{return await new Promise((resolve,reject)=>{const tx=db.transaction(['library','tracks'],'readonly');const lib=tx.objectStore('library').get(id);lib.onsuccess=()=>{if(lib.result){resolve(lib.result)}else{const old=tx.objectStore('tracks').get(id);old.onsuccess=()=>resolve(old.result);old.onerror=()=>reject(old.error)}};lib.onerror=()=>reject(lib.error)})}finally{db.close()}}
async function libraryLocalRows(){const db=await getDB();try{return await new Promise((resolve,reject)=>{const tx=db.transaction('library','readonly'),req=tx.objectStore('library').getAll();req.onsuccess=()=>resolve(req.result.map(({blob,...meta})=>({...meta,local:true})));req.onerror=()=>reject(req.error)})}finally{db.close()}}
async function storeLibraryRow(row){const db=await getDB();try{await new Promise((resolve,reject)=>{const tx=db.transaction('library','readwrite');tx.objectStore('library').put(row);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}finally{db.close()}}
async function removeLocalTrack(id){const db=await getDB();try{await new Promise((resolve,reject)=>{const tx=db.transaction('library','readwrite');tx.objectStore('library').delete(id);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}finally{db.close()}}
async function saveLibraryFile(file,trackId=null){if(!validAudio(file))throw Error('Choose an MP3, WAV, M4A, OGG, AAC or FLAC file.');if(file.size>30*1024*1024)throw Error('Individual tracks must be under 30 MB.');const meta=inferFileMeta(file.name);const item={id:trackId||id(),name:file.name,artist:meta.artist,title:meta.title,bytes:file.size,mime:file.type||'audio/mpeg',added:new Date().toISOString(),blob:file};await storeLibraryRow(item);return {...item,local:true}}
function assignTrack(item,rec){if(!item||!rec)return;item.audioId=rec.id;item.audioName=rec.name;item.audioCloudPath=rec.cloudPath||null;save()}
async function migrateOldSongAudio(){try{const db=await getDB();const old=await new Promise((resolve,reject)=>{const tx=db.transaction('tracks','readonly'),req=tx.objectStore('tracks').getAll();req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)});db.close();let changed=false;for(const rec of old){if(!rec?.blob)continue;const local=await getLocalAudio(rec.id);if(local&&local.blob && local.artist!==undefined)continue;const match=data.rounds.filter(r=>r.type==='intros').flatMap(r=>r.items).find(x=>x.id===rec.id||x.audioName===rec.name);const m=inferFileMeta(rec.name);await storeLibraryRow({id:rec.id,name:rec.name,blob:rec.blob,bytes:rec.blob.size,mime:rec.blob.type,added:new Date().toISOString(),artist:match?.artist||m.artist,title:match?.title||m.title});if(match&&!match.audioId){match.audioId=rec.id;changed=true}}if(changed)save()}catch(e){console.warn('Legacy audio migration:',e)}}
async function refreshLibrary(){try{const local=await libraryLocalRows();let combined=new Map(local.map(x=>[x.id,x]));for(const row of cloudCache){const old=combined.get(row.id);combined.set(row.id,{...old,...row,local:!!old?.local,cloudPath:row.cloudPath})}libraryCache=[...combined.values()].sort((a,b)=>String(a.name).localeCompare(String(b.name)));let fixed=false;for(const it of data.rounds.filter(r=>r.type==='intros').flatMap(r=>r.items)) {if(it.audioId||it.audioCloudPath)continue;const nameHit=libraryCache.find(t=>it.audioName&&t.name===it.audioName);const songHit=libraryCache.find(t=>normalize(t.artist)===normalize(it.artist)&&normalize(t.title)===normalize(it.title)&&it.title);if(nameHit||songHit){assignTrack(it,nameHit||songHit);fixed=true}}if(fixed)save();if(state.tab==='library')renderLibrary()}catch(e){libraryMessage='Cannot load local tracks: '+e.message;if(state.tab==='library')renderLibrary()}}
async function resolveAudio(it){let rec=await getLocalAudio(it.audioId||it.id);if(rec?.blob)return rec;const lib=libraryCache.find(t=>t.id===it.audioId);const path=it.audioCloudPath||lib?.cloudPath;if(path&&cloudSession){const blob=await cloudDownload(path);const row={id:it.audioId||path.split('/').pop().split('--')[0],name:it.audioName||lib?.name||'track.mp3',bytes:blob.size,mime:blob.type,blob,artist:it.artist,title:it.title,cloudPath:path,added:new Date().toISOString()};await storeLibraryRow(row);await refreshLibrary();return row}return null}
function stopLibraryPreview(){if(libraryPreview){libraryPreview.pause();libraryPreview.src='';libraryPreview=null}if(libraryPreviewUrl){URL.revokeObjectURL(libraryPreviewUrl);libraryPreviewUrl=null}}
async function previewLibrary(id){try{stopLibraryPreview();const track=libraryCache.find(t=>t.id===id);const item={audioId:id,audioName:track?.name,audioCloudPath:track?.cloudPath,artist:track?.artist,title:track?.title,id};const row=await resolveAudio(item);if(!row?.blob)throw Error('Not available on this device. Sign in to cloud storage, or upload a local file.');libraryPreviewUrl=URL.createObjectURL(row.blob);libraryPreview=new Audio(libraryPreviewUrl);await libraryPreview.play();const player=libraryPreview;setTimeout(()=>{if(libraryPreview===player){stopLibraryPreview()}},5000);toast('Previewing first 5 seconds: '+track.name)}catch(e){toast('Could not play recording: '+e.message)}}

function openTrackPicker(itemId){uploadTargetId=itemId;const it=data.rounds.flatMap(r=>r.items).find(x=>x.id===itemId);if(!it)return;const root=$('#modalRoot');root.innerHTML=`<div class="modal-backdrop"><div class="modal" style="width:min(620px,95vw);max-height:94vh;overflow:auto"><div class="eyebrow">BACK OFFICE MUSIC LIBRARY</div><h2 style="margin:8px 0">Choose an intro recording</h2><p>Assign an existing recording to <strong>${escapeHTML(it.artist+' — '+it.title)}</strong>, or upload a new file here.</p><input id="pickerSearch" class="library-modal-search" placeholder="Search song, artist or filename"><div id="pickerResults" class="library-modal-list"></div><div class="modal-actions" style="justify-content:space-between"><button id="pickerUpload" class="btn green">＋ Upload new audio</button><button id="pickerCancel" class="btn outline">Cancel</button></div></div></div>`;const show=()=>{const query=normalize($('#pickerSearch').value);$('#pickerResults').innerHTML=libraryCache.filter(t=>!query||normalize(t.name+' '+t.artist+' '+t.title).includes(query)).map(t=>`<div class="library-modal-item"><span><strong>${escapeHTML(t.name)}</strong><span style="display:block;color:#99b0ba;font-size:11px">${escapeHTML(t.artist||'')} ${t.cloudPath?' · Private cloud':''}${t.local?' · On laptop':''}</span></span><button class="btn green small" data-pick="${escapeHTML(t.id)}">Use track</button></div>`).join('')||'<div class="library-empty">No matching recordings. Upload one below.</div>';root.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>chooseTrack(itemId,b.dataset.pick))};$('#pickerSearch').oninput=show;$('#pickerUpload').onclick=()=>{$('#modalRoot').innerHTML='';$('#trackUploader').click()};$('#pickerCancel').onclick=()=>{$('#modalRoot').innerHTML='';uploadTargetId=null};show()}
async function importLibraryFiles(files){if(libraryBusy)return;libraryBusy=true;libraryMessage='Importing recordings…';if(state.tab==='library')renderLibrary();let added=0,uploaded=0,failed=0;for(const file of files){try{const track=await saveLibraryFile(file);added++;if(cloudSession){try{await uploadCloud(track,file);uploaded++}catch(err){libraryMessage='Cloud upload error: '+err.message}}}catch(e){failed++;libraryMessage=e.message}}libraryBusy=false;await refreshLibrary();toast(`${added} recording(s) saved locally${uploaded?' · '+uploaded+' cloud uploads':''}${failed?' · '+failed+' failed':''}`);if(state.tab==='library')renderLibrary()}

// Private cloud sync uses only a public publishable key; sign-in JWT + per-user RLS protects music.
function cloudHeaders(json=true){return {'apikey':CLOUD_KEY,...(cloudSession?.access_token?{'Authorization':'Bearer '+cloudSession.access_token}:{}),...(json?{'Content-Type':'application/json'}:{})}}
async function cloudRequest(path,{method='GET',body,contentType,auth=true,upsert=false}={}){if(auth)await cloudEnsureSession();const head=cloudHeaders(!contentType);if(contentType)head['Content-Type']=contentType;if(upsert){head['x-upsert']='true';head['Prefer']='resolution=merge-duplicates,return=minimal'};const response=await fetch(CLOUD_URL+path,{method,headers:head,body:body==null?undefined:(body instanceof Blob||typeof body==='string'?body:JSON.stringify(body))});if(!response.ok){let message=await response.text();try{message=JSON.parse(message).msg||JSON.parse(message).message||JSON.parse(message).error_description||message}catch(e){}throw Error(message.slice(0,240))}if(response.status===204)return null;const type=response.headers.get('content-type')||'';if(type.includes('application/json')){const raw=await response.text();return raw?JSON.parse(raw):null}return response.blob()}
async function cloudEnsureSession(){if(!cloudSession?.access_token)throw Error('Sign in to cloud storage first.');if(cloudSession.expires_at&&Date.now()<cloudSession.expires_at-90000)return;const session=cloudSession;const result=await fetch(CLOUD_URL+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{'apikey':CLOUD_KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:session.refresh_token})});if(!result.ok){cloudSession=null;localStorage.removeItem(CLOUD_SESSION_KEY);throw Error('Cloud session expired — please sign in again.')}const r=await result.json();cloudSession={...r,expires_at:Date.now()+r.expires_in*1000,user:r.user||session.user};localStorage.setItem(CLOUD_SESSION_KEY,JSON.stringify(cloudSession))}
async function cloudSignIn(email,password,newAccount=false){if(!email||!password)throw Error('Enter your email address and password.');const path=newAccount?'/auth/v1/signup':'/auth/v1/token?grant_type=password';const resp=await fetch(CLOUD_URL+path,{method:'POST',headers:{'apikey':CLOUD_KEY,'Content-Type':'application/json'},body:JSON.stringify({email,password})});const result=await resp.json();if(!resp.ok)throw Error(result.msg||result.error_description||result.message||'Authentication failed');if(!result.access_token){libraryMessage='Account created. Verify your email using the confirmation link, then sign in.';toast(libraryMessage);renderLibrary();return}cloudSession={...result,expires_at:Date.now()+(result.expires_in||3600)*1000};localStorage.setItem(CLOUD_SESSION_KEY,JSON.stringify(cloudSession));await cloudLoadFiles();toast('Signed in to your private cloud library.');renderLibrary()}
function cloudLogout(){cloudSession=null;cloudCache=[];localStorage.removeItem(CLOUD_SESSION_KEY);refreshLibrary();toast('Cloud signed out. Locally saved audio remains.')}
async function cloudLoadFiles(){if(!cloudSession)return;libraryMessage='Loading private cloud files…';const uid=cloudSession.user.id;const rows=await cloudRequest('/storage/v1/object/list/'+CLOUD_BUCKET,{method:'POST',body:{prefix:uid+'/',limit:1000,offset:0,sortBy:{column:'name',order:'asc'}}});cloudCache=(rows||[]).filter(x=>x.name&&x.name!=='_quiz_state.json').map(x=>{const f=x.name;const split=f.indexOf('--');const fileId=split>=0?f.slice(0,split):f;const name=split>=0?f.slice(split+2):f;const meta=inferFileMeta(name);return {id:fileId,name,artist:meta.artist,title:meta.title,bytes:x.metadata?.size||0,cloudPath:uid+'/'+f,cloud:true,local:false}});libraryMessage=`Cloud connected · ${cloudCache.length} recording(s)`;await refreshLibrary()}
async function uploadCloud(track,file){if(!cloudSession)return null;const uid=cloudSession.user.id;const safe=track.name.replace(/[^a-zA-Z0-9._ -]/g,'_').slice(0,140);const path=uid+'/'+track.id+'--'+safe;await cloudRequest('/storage/v1/object/'+CLOUD_BUCKET+'/'+encodeURIComponent(uid)+'/'+encodeURIComponent(track.id+'--'+safe),{method:'POST',body:file,contentType:file.type||'audio/mpeg'});track.cloudPath=path;const item=data.rounds.flatMap(r=>r.items).filter(x=>x.audioId===track.id);item.forEach(it=>it.audioCloudPath=path);if(item.length)save();cloudCache=[...cloudCache.filter(r=>r.id!==track.id),{...track,cloudPath:path,cloud:true,local:true}];return path}
async function cloudDownload(path){if(!cloudSession)throw Error('Sign in to the cloud first.');const result=await cloudRequest('/storage/v1/object/sign/'+CLOUD_BUCKET+'/'+path.split('/').map(encodeURIComponent).join('/'),{method:'POST',body:{expiresIn:1800}});const url=result.signedURL||result.signedUrl;const signedUrl=url.startsWith('http')?url:CLOUD_URL+'/storage/v1'+url;const response=await fetch(signedUrl,{headers:{apikey:CLOUD_KEY}});if(!response.ok)throw Error('Cloud download failed');return response.blob()}
async function cloudPushQuiz(){if(!cloudSession)return toast('Sign in to cloud first.');try{await cloudRequest('/rest/v1/music_quiz_show_state?on_conflict=owner_id',{method:'POST',body:{owner_id:cloudSession.user.id,quiz_data:data},upsert:true});toast('Quiz questions and song assignments saved to private cloud.')}catch(e){toast('Cloud backup failed: '+e.message)}}
async function cloudPullQuiz(){if(!cloudSession)return toast('Sign in to cloud first.');try{const rows=await cloudRequest('/rest/v1/music_quiz_show_state?select=quiz_data,updated_at&owner_id=eq.'+encodeURIComponent(cloudSession.user.id));if(!Array.isArray(rows)||!rows[0]?.quiz_data?.rounds)throw Error('No saved cloud quiz yet. Save this quiz to cloud first.');showConfirm('Replace local quiz with cloud version?','This changes the local questions and song assignments to the saved cloud version. Your library audio files are kept.',()=>{stopAudio(false);data=rows[0].quiz_data;save();setRound(data.rounds[0].id);refreshLibrary();toast('Cloud quiz loaded.')})}catch(e){toast('Cloud restore failed: '+e.message)}}
async function cloudSyncLocal(){if(!cloudSession)return toast('Sign in to cloud first.');if(libraryBusy)return;libraryBusy=true;renderLibrary();let synced=0,failed=0;for(const track of libraryCache.filter(x=>x.local&&!x.cloudPath)){try{const rec=await getLocalAudio(track.id);await uploadCloud(track,rec.blob);synced++}catch(e){failed++}}libraryBusy=false;await cloudLoadFiles();toast(`${synced} local recordings uploaded to cloud${failed?' · '+failed+' failed':''}`)}
async function deleteLibraryTrack(trackId){const track=libraryCache.find(t=>t.id===trackId);if(!track)return;showConfirm('Remove recording?','Remove '+track.name+' from your local library'+(track.cloudPath?' and your private cloud bucket':'')+'? Linked quiz intros will no longer play until assigned a new track.',async()=>{try{if(track.cloudPath&&cloudSession)await cloudRequest('/storage/v1/object/'+CLOUD_BUCKET+'/'+track.cloudPath.split('/').map(encodeURIComponent).join('/'),{method:'DELETE'});else if(track.cloudPath)throw Error('Sign in to delete the cloud copy.');await removeLocalTrack(trackId);cloudCache=cloudCache.filter(x=>x.id!==trackId);for(const it of data.rounds.flatMap(r=>r.items)){if(it.audioId===trackId){it.audioId=null;it.audioName='';it.audioCloudPath=null}}save();await refreshLibrary();toast('Recording removed from the library.')}catch(e){toast('Could not remove recording: '+e.message)}})}
function renderLibrary(){const songs=data.rounds.filter(r=>r.type==='intros').flatMap(r=>r.items),usedCount=libraryCache.filter(t=>songs.some(s=>s.audioId===t.id)).length,total=libraryCache.reduce((n,t)=>n+(t.bytes||0),0);const signed=!!cloudSession,search=normalize(librarySearch),tracks=libraryCache.filter(t=>!search||normalize(t.name+' '+t.title+' '+t.artist).includes(search));$('#content').innerHTML=`<div class="library-stats"><div class="library-stat"><strong>${libraryCache.length}</strong><span>Saved recordings</span></div><div class="library-stat"><strong>${usedCount}/${songs.length}</strong><span>Library tracks assigned / intros</span></div><div class="library-stat"><strong>${sizeText(total)}</strong><span>Music library size</span></div></div><section class="pane"><div class="library-section"><div class="library-topflex"><div><div class="pane-kicker">BURTCO BACK OFFICE</div><h2 style="font-size:26px;margin:5px 0">Music library</h2><p class="help-text">Upload once, select songs in Edit questions, and reuse recordings in any round. Local files play offline.</p></div><span class="badge ${signed?'':'amber'}">${signed?'PRIVATE CLOUD CONNECTED':'LOCAL MODE'}</span></div><div class="library-drop" id="libraryDrop" tabindex="0"><strong>＋ Upload MP3 / audio recordings</strong><p>Click or drag multiple files here · MP3, WAV, M4A, OGG, AAC · Max 30 MB each</p><label class="library-file-button" for="libraryUploader">Choose audio files</label></div><div class="library-toolbar"><input id="librarySearch" type="search" placeholder="Search by artist, song or filename" value="${escapeHTML(librarySearch)}"><button id="libraryRefresh" class="btn small outline">↻ Refresh</button>${signed?'<button id="cloudSyncTracks" class="btn small outline">↑ Sync local recordings</button>':''}</div>${libraryBusy?'<p class="library-activity">Uploading and indexing recordings…</p>':''}<div class="library-scroll"><table class="library-table"><thead><tr><th>Recording</th><th>Stored</th><th>Size</th
