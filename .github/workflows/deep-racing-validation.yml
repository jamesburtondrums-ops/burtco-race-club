name: Deep racing validation

on:
  push:
    branches: [racing-intelligence]
    paths:
      - ".github/workflows/deep-racing-validation.yml"
      - "research/deep_walkforward_backtest.py"

permissions:
  contents: write

concurrency:
  group: deep-racing-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: racing-intelligence
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install analysis packages
        run: pip install --disable-pip-version-check numpy pandas scikit-learn
      - name: Run deep multi-season validation
        run: python research/deep_walkforward_backtest.py
      - name: Commit private research outputs
        run: |
          git config user.name "racing-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add research/output/deep_walkforward_backtest.json research/output/deep_walkforward_backtest.md
          if git diff --cached --quiet; then
            echo "No output changes"
            exit 0
          fi
          git commit -m "Add deep multi-season racing validation results"
          git pull --rebase origin racing-intelligence
          git push origin HEAD:racing-intelligence
