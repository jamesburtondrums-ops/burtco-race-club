name: Racing Intelligence live refresh
on:
  workflow_dispatch:
  schedule:
    - cron: "15 5 * * *"
    - cron: "*/15 7-22 * * *"
permissions:
  contents: write
concurrency:
  group: racing-intelligence-data
  cancel-in-progress: true
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: racing-intelligence
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pull every GB + IRE race and runner
        env:
          RACING_API_USERNAME: ${{ secrets.RACING_API_USERNAME }}
          RACING_API_PASSWORD: ${{ secrets.RACING_API_PASSWORD }}
          RACING_API_PLAN: ${{ vars.RACING_API_PLAN || 'standard' }}
        run: node scripts/refresh-data.mjs
      - name: Commit validated changes
        run: |
          if git diff --quiet data/races.json; then
            echo "No racing data changes."
            exit 0
          fi
          git config user.name "racing-intelligence-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/races.json
          git commit -m "Refresh all GB and IRE racing data"
          git push origin HEAD:racing-intelligence