name: Racing data refresh
on:
  workflow_dispatch:
  schedule:
    - cron: "15 5 * * *"
    - cron: "0 9-20/2 * * *"
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: racing-intelligence
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh validated racing data
        env:
          RACING_FEED_URL: ${{ secrets.RACING_FEED_URL }}
          RACING_FEED_TOKEN: ${{ secrets.RACING_FEED_TOKEN }}
        run: node scripts/refresh-data.mjs
      - name: Commit genuine changes
        run: |
          if git diff --quiet data/races.json; then exit 0; fi
          git config user.name "racing-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/races.json
          git commit -m "Refresh racing data"
          git push origin HEAD:racing-intelligence