name: Trainer View integrity tests
on:
  push:
    branches: [racing-intelligence]
    paths:
      - "functions/_lib/trainer-view.mjs"
      - "functions/_private/racing-track-profiles.json"
      - "functions/api/backoffice/report.js"
      - "scripts/import-racing-research.mjs"
      - "tests/trainer-view.test.mjs"
      - "tests/racing-tracker.test.mjs"
      - "tests/racing-backoffice.test.mjs"
      - "tests/race-time-analysis.test.mjs"
      - "functions/_lib/race-time-analysis.mjs"
      - "functions/_private/racing-manual-sectionals-example.json"
      - "backoffice.js"
      - "data/races.json"
      - "data/bet-ledger.json"
      - "tests/racing-third-party.test.mjs"
      - "functions/_lib/third-party-research.mjs"
      - "functions/_private/racing-third-party-sources.json"
      - "functions/_private/racing-third-party-observations.json"
      - ".github/workflows/trainer-view-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify research and trainer-intent gates
        run: node --test tests/trainer-view.test.mjs tests/racing-research.test.mjs tests/racing-third-party.test.mjs tests/racing-tracker.test.mjs tests/racing-backoffice.test.mjs tests/race-time-analysis.test.mjs
