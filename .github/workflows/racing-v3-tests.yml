name: Racing v3 software integrity
on:
  push:
    branches: [racing-intelligence-v3]
    paths: ['v3/**', '.github/workflows/racing-v3-tests.yml']
  pull_request:
    paths: ['v3/**', '.github/workflows/racing-v3-tests.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r v3/requirements.txt
      - run: python -m pytest v3/tests -q
      - run: node v3/tests/client-render.cjs
      - run: node v3/tests/today-render.cjs

