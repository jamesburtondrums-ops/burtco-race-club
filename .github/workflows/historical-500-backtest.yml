name: Historical 500+ race backtest

on:
  push:
    branches: [racing-intelligence]
    paths:
      - ".github/workflows/historical-500-backtest.yml"
      - "research/historical_backtest_500.py"

permissions:
  contents: write

concurrency:
  group: historical-racing-backtest
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: racing-intelligence
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install analysis packages
        run: pip install --disable-pip-version-check numpy pandas scikit-learn
      - name: Run 500+ race historical backtest
        run: python research/historical_backtest_500.py
      - name: Commit research results
        run: |
          git config user.name "racing-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add research/output/
          if git diff --cached --quiet; then
            echo "No output changes"
            exit 0
          fi
          git commit -m "Add 500+ race historical backtest results"
          git pull --rebase origin racing-intelligence
          git push origin HEAD:racing-intelligence
